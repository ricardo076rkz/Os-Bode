<!DOCTYPE html>
<html lang="PT-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feir.ON</title>

    <link rel="stylesheet" href="../css/style1.css">
    <script src="../js/tela1.js" defer></script>
</head>
<body>
          <div class="moldura">
            <main class="tela">
              <div class="Perfil"></div>
              <img src="../img/logo.png" alt="logo" class="logo">
              <h1 class="title">Nordestinando</h1>
              <form id="form-login">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Seu e-mail" required>
                <label for="password">Senha</label>
                    <div class="campo-senha">
                    <input type="password" id="password" name="password" placeholder="Sua senha" required>
                        <button type="button" class="olho" id="ver-senha" aria-label="Mostrar senha">
                        <svg class="icone-aberto" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="icone-riscado" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                            <circle cx="12" cy="12" r="3"/>
                            <line x1="3" y1="3" x2="21" y2="21"/>
                        </svg>
                        </button>
                    </div>
                <div class="links-login">
                    <a href="#" id="Esqueci minha senha">Esqueci minha senha</a>
                    <a href="#" id="criar_conta">Criar conta</a>
                </div>
                <div class="acesso-visitante">
                  <a href="#" id="acesso-sem-login">Acesso sem login</a>
                </div>
                <button type="submit" class="botao">Entrar</button>
              </form>
            </main>
        </div>
    </section>
</body>
</html>
