<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#3b2f8f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nordestinando">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/js/img/app/icone-192.png">
  <link rel="apple-touch-icon" href="/js/img/app/icone-192.png">
  <title>Nordestinando - Entrar</title>
  <script src="../js/tema.js"></script>
  <link rel="stylesheet" href="../style/style.css">
</head>
<body>
  <main class="tela entrar">
    <div class="marca-centro">
      <img src="../js/img/logo-original.png" alt="" class="logo">
      <span>Nordestinando</span>
    </div>
    <h1>Entre ou crie sua conta</h1>

    <div class="perfil">
      <label class="perfil-opcao">
        <input type="radio" name="perfil" value="CLIENTE" checked>
        <span>Sou usuário</span>
      </label>
      <label class="perfil-opcao">
        <input type="radio" name="perfil" value="LOGISTA">
        <span>Sou comerciante</span>
      </label>
    </div>
    <p id="descricao-perfil" class="descricao-perfil"></p>

    <!-- ENTRAR (usuário e comerciante) -->
    <form id="form-login" class="cartao">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" autocomplete="email" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="current-password" required>

      <a class="esqueci" href="recuperar_senha.html">Esqueci minha senha</a>
      <button type="submit" class="botao">Entrar</button>
    </form>

    <!-- CRIAR CONTA DE USUÁRIO -->
    <form id="form-conta" class="cartao oculto">
      <label for="c-nome">Nome completo</label>
      <input type="text" id="c-nome" name="nome" autocomplete="name" required>

      <label for="c-email">E-mail</label>
      <input type="email" id="c-email" name="email" autocomplete="email" required>

      <label for="c-telefone">Telefone com DDD</label>
      <input type="tel" id="c-telefone" name="telefone" placeholder="(81) 99999-9999" required>

      <label for="c-senha">Senha (mínimo 8, com letras e números)</label>
      <input type="password" id="c-senha" name="senha" minlength="8" autocomplete="new-password" required>

      <label for="c-confirmar">Confirmar senha</label>
      <input type="password" id="c-confirmar" name="confirmar_senha" minlength="8" autocomplete="new-password" required>

      <label class="aceite"><input type="checkbox" name="aceite" id="c-aceite" required><span>Li e aceito os <a href="termos.html" target="_blank" rel="noopener">Termos de Uso</a> e a <a href="privacidade.html" target="_blank" rel="noopener">Política de Privacidade</a>, e declaro ter 18 anos ou mais (ou autorização de um responsável).</span></label>
      <button type="submit" class="botao">Criar conta de usuário</button>
    </form>

    <!-- CRIAR CONTA DE COMERCIANTE (cadastro completo em etapas) -->
    <div id="criar-comerciante" class="cartao oculto">
      <p>O cadastro do comerciante tem 4 etapas: seus dados, o estabelecimento, endereço e localização, e horários.</p>
      <a class="botao" href="cadastrar_estabelecimento.html">Cadastrar meu estabelecimento</a>
    </div>

    <p id="mensagem" class="mensagem oculto"></p>

    <button type="button" id="trocar-modo" class="esqueci link-botao"></button>
    <a class="esqueci" href="../index.html">← Voltar ao início</a>
  </main>

  <script src="../js/icones.js"></script>
  <script src="../js/comum.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/tela1.js"></script>
</body>
</html>
