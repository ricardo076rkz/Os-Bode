<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#3b2f8f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nordestinando">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/js/img/app/icone-192.png">
  <link rel="apple-touch-icon" href="/js/img/app/icone-192.png">
  <title>Nova senha - Nordestinando</title>
  <script src="../js/tema.js"></script>
  <link rel="stylesheet" href="../style/style.css">
</head>
<body>
  <main class="tela fundo-estacao">
    <div class="topo">
      <h1>Nova senha</h1>
    </div>
    <form id="form" class="cartao" novalidate>
      <label for="senha">Nova senha</label>
      <input id="senha" name="senha" type="password" autocomplete="new-password" required>
      <small class="dica">Mínimo de 8 caracteres, com letras e números.</small>
      <label for="confirmar_senha">Repita a nova senha</label>
      <input id="confirmar_senha" name="confirmar_senha" type="password" autocomplete="new-password" required>
      <button type="submit" class="botao">Salvar nova senha</button>
      <p id="mensagem" class="mensagem oculto" role="status"></p>
    </form>
    <a class="esqueci" href="tela.html">← Ir para o login</a>
  </main>
  <script src="../js/icones.js"></script>
  <script src="../js/comum.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/redefinir.js"></script>
</body>
</html>
