<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login Comerciante</title>
  <script src="../js/tema.js"></script>
  <link rel="stylesheet" href="../style/style.css">
</head>
<body>
  <main class="tela fundo-estacao">
    <div class="topo">
      <div class="topo-icone"><i data-icone="loja_grande"></i></div>
      <h1>Área do comerciante</h1>
      <p>Entre para cuidar da sua loja.</p>
    </div>

    <form id="form-login" class="cartao">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password" required>

      <p id="mensagem" class="mensagem oculto"></p>

      <a class="esqueci" href="recuperar_senha.html">Esqueci minha senha</a>

      <button type="submit" class="botao">Entrar</button>
      <a class="botao cadastrar" href="cadastrar_estabelecimento.html">Cadastrar Estabelecimento</a>
    </form>

    <a class="esqueci" href="../index.html">← Voltar ao início</a>
  </main>

  <script src="../js/icones.js"></script>
  <script src="../js/comum.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/comerciante.js"></script>
</body>
</html>
