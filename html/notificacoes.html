<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notificações - Nordestinando</title>
  <script src="../js/tema.js"></script>
  <link rel="stylesheet" href="../style/style.css">
</head>
<body>
  <main class="tela pagina-conta">
    <div class="cabeca">
      <a class="voltar-link" href="#" id="voltar" aria-label="Voltar"><i data-icone="voltar"></i></a>
      <h1>Notificações</h1>
      <a class="voltar-link" href="configuracoes.html" aria-label="Configurações"><i data-icone="engrenagem"></i></a>
    </div>

    <div class="abas" role="tablist">
      <button class="aba" role="tab" id="aba-todas" aria-selected="true">Todas</button>
      <button class="aba" role="tab" id="aba-novas" aria-selected="false">Não lidas <span id="qtd-novas"></span></button>
    </div>
    <div class="botoes-linha">
      <button class="botao contorno" id="marcar-todas" type="button"><i data-icone="check"></i>Marcar todas como lidas</button>
      <button class="botao contorno" id="limpar-lidas" type="button"><i data-icone="lixeira"></i>Apagar lidas</button>
    </div>

    <p id="mensagem" class="mensagem oculto" role="status"></p>
    <div id="lista" aria-live="polite"></div>
  </main>
  <script src="../js/icones.js"></script>
  <script src="../js/comum.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/conta-ui.js"></script>
  <script src="../js/notificacoes.js"></script>
</body>
</html>
