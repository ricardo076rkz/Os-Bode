<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#3b2f8f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nordestinando">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/js/img/app/icone-192.png">
  <link rel="apple-touch-icon" href="/js/img/app/icone-192.png">
  <title>Explorar Cidade</title>
  <script src="../js/tema.js"></script>
  <link rel="stylesheet" href="../style/style.css">
</head>
<body>
  <main class="tela larga">
    <header class="app-topo">
      <div class="marca">
        <img class="logo" src="../js/img/logo-original.png" alt="">
        <span>Nordestinando</span>
      </div>
      <span id="conta"></span>
    </header>

    <div class="saudacao">
      <h1>Explorar Caruaru</h1>
      <p id="clima" class="clima oculto"></p>
    </div>

    <div class="busca">
      <i data-icone="busca"></i>
      <input type="search" id="busca" placeholder="Buscar loja" aria-label="Buscar loja">
    </div>
    <div class="chips" id="chips"></div>

    <div id="mapa" class="mapa mapa-grande"></div>

    <h3>Lojas</h3>
    <div id="lista-lojas"></div>

    <section id="eventos" aria-labelledby="titulo-eventos">
      <h3 id="titulo-eventos">Agenda de Caruaru</h3>
      <div class="chips" id="filtro-categoria" aria-label="Filtrar eventos por categoria"></div>
      <div class="chips" id="filtro-dia" aria-label="Filtrar eventos por dia"></div>
      <div id="lista-eventos" aria-live="polite"></div>
    </section>
    <dialog id="detalhe-evento" aria-labelledby="detalhe-titulo"></dialog>
    <dialog id="dialogo-avaliar" aria-labelledby="avaliar-titulo"></dialog>

    <div id="meus-pedidos" class="oculto">
      <h3>Minhas reservas</h3>
      <div id="lista-pedidos"></div>
    </div>

    <p id="mensagem" class="mensagem oculto"></p>
    <a class="botao cadastrar" href="../index.html">Voltar ao início</a>
  </main>

  <script src="../js/icones.js"></script>
  <script src="../js/comum.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/conta-ui.js"></script>
  <script src="../js/mapa.js"></script>
  <script src="../js/avaliar.js"></script>
  <script src="../js/explorar.js"></script>
</body>
</html>
