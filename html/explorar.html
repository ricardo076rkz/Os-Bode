<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Explorar Cidade</title>
  <link rel="stylesheet" href="../style/style.css">
</head>
<body>
  <main class="tela">
    <div class="bandeirinhas"></div>
    <header class="app-topo">
      <div class="marca">
        <img class="logo" src="../js/img/logo-original.png" alt="">
        <span>Nordestinando</span>
      </div>
      <span id="conta"></span>
    </header>

    <div class="saudacao">
      <h1>Explorar Caruaru</h1>
      <p id="clima" class="clima oculto"></p>
    </div>

    <div class="busca">
      <i data-icone="busca"></i>
      <input type="search" id="busca" placeholder="Buscar loja" aria-label="Buscar loja">
    </div>
    <div class="chips" id="chips"></div>

    <div id="mapa" class="mapa mapa-grande"></div>

    <h3>Lojas</h3>
    <div id="lista-lojas"></div>

    <h3>Eventos</h3>
    <div id="lista-eventos"></div>

    <div id="meus-pedidos" class="oculto">
      <h3>Minhas reservas</h3>
      <div id="lista-pedidos"></div>
    </div>

    <p id="mensagem" class="mensagem oculto"></p>
    <a class="botao cadastrar" href="../index.html">Voltar ao início</a>
  </main>

  <script src="../js/icones.js"></script>
  <script src="../js/comum.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/mapa.js"></script>
  <script src="../js/explorar.js"></script>
</body>
</html>
